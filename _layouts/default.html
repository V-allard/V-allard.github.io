<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- <title>Valentin Allard</title> -->
  <title>{{ page.title }} - Valentin Allard</title>

  <!-- Cayman font -->
  <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet" />

  <!-- Style -->
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      min-height: 100vh;
      background-color: #f6f8fa;
      color: #111;
      font-family: "Lato", sans-serif;
    }

    .sidebar {
      width: 280px;
      background-color: #0366d6;
      padding: 2rem 1rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
    }

    .sidebar img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
      border: 3px solid white;
    }

    .sidebar h1 {
      margin: 0.5rem 0 0.2rem;
      font-size: 1.4rem;
      text-align: center;
    }

    .sidebar p {
      font-size: 0.9rem;
      margin: 0.2rem 0;
      text-align: center;
    }

    .main-content {
      flex-grow: 1;
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .navbar {
      margin: 1rem 0 2rem;
      text-align: center;

      border-bottom: 2px solid #0366d6; /* Ligne bleue sous la navbar */
      padding-bottom: 0.5rem;            /* Un peu d’espace sous le texte */
      margin-bottom: 1rem;               /* Sépare la navbar du contenu suivant */
    }

    .navbar a {
      color: #0366d6;
      text-decoration: none;
      margin: 0 0.5rem;
      font-weight: bold;
      font-size: 1.2rem;  /* augmentation de la taille */

    }

    .navbar a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      color: #555;
    }

    .main-content p {
    line-height: 1.6;
    }

    .navbar a.active {
    border-bottom: 2px solid #0366d6;
    }

    .sidebar img:hover {
    transform: scale(1.03);
    transition: transform 0.2s ease;
    }

    footer p {
    font-size: 0.8rem;
    color: #888;
    }

    
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        flex-direction: row;
        justify-content: center;
        gap: 1.5rem;
        padding: 1rem;
        text-align: left;
      }

      .sidebar img {
        width: 80px;
        height: 80px;
      }

      .sidebar h1, .sidebar p {
        text-align: left;
      }

      .main-content {
        padding: 1rem;
      }

      .navbar a {
        font-size: 1.1rem;
      }
    }

  /* Espacement des listes sur tout le site */
ul {
    padding-left: 1.5rem; /* décale les puces */
    margin-bottom: 1.5rem; /* espace sous la liste */
}

li {
    margin-bottom: 0.8rem; /* espace entre chaque élément de la liste */
    line-height: 1.5;      /* rend le texte plus lisible */
}
  </style>
</head>

<body>
  <div class="sidebar">
    <img src="/assets/images/PhotoCV.png" alt="Valentin Allard">
    <div>
      <h1>Valentin Allard</h1>
      <h1>(발렌틴 알라르)</h1>
      <p>Assistant professor</p>
      <div style="font-size: 0.9rem; color: white; line-height: 1.2; margin-top: 0.5rem; text-align: center;">
        <p style="margin: 0;">Yonsei University</p>
        <p style="margin: 0;">Department of Physics</p>
        <p style="margin: 0;">Science Hall 327A, 50 Yonsei-ro, Seodaemun-gu, Seoul (zip: 03722)</p>
        <p style="margin: 0.2rem 0 0;"><a href="mailto:valentin.allard@pw.edu.pl" style="color: white; text-decoration: underline;">valentin.allard[at]pw.edu.pl</a></p>
        <p style="margin: 0;">+82 10-3602-2404</p>
      </div>
    </div>
  </div>

  <div class="main-content">
    <nav class="navbar">
      <a href="/">Home</a>
      <a href="/thesis/">Thesis</a>
      <a href="/cv/">CV</a>
      <a href="/publications/">Publications</a>
      <a href="/teaching/">Teaching</a>
      <a href="/talks/">Talks</a>
      <a href="/graphics/">Graphics</a>
    </nav>

    <div class="content">
      {{ content }}
    </div>

    <footer class="footer">
      <p>&copy; 2025 Valentin Allard</p>
    </footer>
  </div>
</body>
</html>
